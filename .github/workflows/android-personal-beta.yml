name: Android Personal Beta signing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-personal-beta-signing
  cancel-in-progress: false

jobs:
  sign-personal-beta:
    name: Build and verify Owner-signed Personal Beta APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: serea-personal-beta
    steps:
      - name: Check out the trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK build tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Require protected Personal Beta signing configuration
        env:
          SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_BASE64: ${{ secrets.SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_BASE64 }}
          SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_PASSWORD: ${{ secrets.SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_PASSWORD }}
          SEREA_ANDROID_PERSONAL_BETA_KEY_ALIAS: ${{ secrets.SEREA_ANDROID_PERSONAL_BETA_KEY_ALIAS }}
          SEREA_ANDROID_PERSONAL_BETA_KEY_PASSWORD: ${{ secrets.SEREA_ANDROID_PERSONAL_BETA_KEY_PASSWORD }}
          SEREA_ANDROID_PERSONAL_BETA_CERT_SHA256: ${{ vars.SEREA_ANDROID_PERSONAL_BETA_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in \
            SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_BASE64 \
            SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_PASSWORD \
            SEREA_ANDROID_PERSONAL_BETA_KEY_ALIAS \
            SEREA_ANDROID_PERSONAL_BETA_KEY_PASSWORD \
            SEREA_ANDROID_PERSONAL_BETA_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "Personal Beta signing is NOT_RUN: required protected Environment setting $name is missing."
              exit 1
            fi
          done
          fingerprint=$(printf '%s' "$SEREA_ANDROID_PERSONAL_BETA_CERT_SHA256" | tr -d ':[:space:]')
          if ! [[ "$fingerprint" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo 'Personal Beta signing is NOT_RUN: certificate fingerprint must contain 64 hexadecimal characters.'
            exit 1
          fi
          version_code=$((GITHUB_RUN_NUMBER + 1))
          if [ "$version_code" -le 1 ] || [ "$version_code" -gt 2147483647 ]; then
            echo 'Personal Beta signing is NOT_RUN: generated versionCode is outside Android limits.'
            exit 1
          fi
          echo "SEREA_PERSONAL_BETA_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Materialize Owner keystore in runner temporary storage
        env:
          SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_BASE64: ${{ secrets.SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/serea-personal-beta-key"
          install -d -m 700 "$key_dir"
          key_file="$key_dir/personal-beta.p12"
          umask 077
          printf '%s' "$SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          test -s "$key_file"
          chmod 600 "$key_file"
          printf 'SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_PATH=%s\n' "$key_file" >> "$GITHUB_ENV"

      - name: Build the signed Personal Beta variant
        working-directory: android
        env:
          SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_PASSWORD: ${{ secrets.SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_PASSWORD }}
          SEREA_ANDROID_PERSONAL_BETA_KEY_ALIAS: ${{ secrets.SEREA_ANDROID_PERSONAL_BETA_KEY_ALIAS }}
          SEREA_ANDROID_PERSONAL_BETA_KEY_PASSWORD: ${{ secrets.SEREA_ANDROID_PERSONAL_BETA_KEY_PASSWORD }}
          SEREA_ANDROID_PERSONAL_BETA_CERT_SHA256: ${{ vars.SEREA_ANDROID_PERSONAL_BETA_CERT_SHA256 }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache clean \
            :app:validatePersonalBetaSigning :app:assembleBeta \
            "-PsereaBetaVersionCode=$SEREA_PERSONAL_BETA_VERSION_CODE"

      - name: Verify APK application identity, certificate, and version
        env:
          BUILD_TOOLS_VERSION: 35.0.0
          SEREA_ANDROID_PERSONAL_BETA_CERT_SHA256: ${{ vars.SEREA_ANDROID_PERSONAL_BETA_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/beta/app-beta.apk'
          test -s "$apk"
          bash tools/verify_personal_beta_apk.sh \
            "$apk" "$SEREA_PERSONAL_BETA_VERSION_CODE" "$SEREA_ANDROID_PERSONAL_BETA_CERT_SHA256"
          output_dir="$RUNNER_TEMP/serea-personal-beta-output"
          install -d -m 700 "$output_dir"
          cp "$apk" "$output_dir/serea-android-personal-beta.apk"
          apk_sha256=$(sha256sum "$apk" | awk '{print $1}')
          certificate_sha256=$(printf '%s' "$SEREA_ANDROID_PERSONAL_BETA_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          {
            echo 'application_id=app.serea.android.beta'
            echo "version_code=$SEREA_PERSONAL_BETA_VERSION_CODE"
            echo 'apk_signature_verification=PASS'
            echo "certificate_sha256=$certificate_sha256"
            echo "apk_sha256=$apk_sha256"
            echo "source_commit_sha=$GITHUB_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "workflow_ref=$GITHUB_REF"
            echo 'signing_key_material_in_artifact=no'
          } > "$output_dir/provenance.txt"
          cat "$output_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified APK and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serea-android-personal-beta-${{ github.run_number }}
          path: ${{ runner.temp }}/serea-personal-beta-output/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/serea-personal-beta-key" "$RUNNER_TEMP/serea-personal-beta-output"
