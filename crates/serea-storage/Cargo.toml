[package]
name = "serea-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# P2H crash/fault seam. Deliberately empty and deliberately NOT a default
# feature. The workspace requests it only from test-target dev-dependency
# edges, so normal/default production builds exclude its window and arming API.
# A build that explicitly opts into this feature contains the seam; the release
# proof records that boundary in `docs/plans/P2H-review-and-closure.md`.
p2h-fault-injection = []
# Explicit synthetic prototype only. Forbidden in optimized builds.
p7-experimental = []
# Gate C contract/ledger development surface. Explicit opt-in only and rejected
# in optimized builds; this is not an ordinary runtime or production API.
p7-gate-c = ["dep:fs2"]

[dependencies]
serea-protocol.workspace = true
fs2 = { version = "0.4.3", optional = true }
rusqlite = { workspace = true, features = ["hooks"] }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
