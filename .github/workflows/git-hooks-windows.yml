name: Git hooks Windows compatibility

on:
  pull_request:
  push:
    branches: ['chore/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix-hooks:
    name: ${{ matrix.os }} Git hook regression
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash tools/assert_exact_source_checkout.sh "$EXPECTED_SOURCE_SHA"
      - name: Install Python 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Run actual hook and launcher fixtures
        run: |
          python -m unittest discover -s tests -p 'git_preflight_tests.py'
          python -m unittest discover -s tests -p 'git_hook_python_tests.py'

  windows-x64-hooks:
    name: Windows x64 Git hooks with python fallback
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash tools/assert_exact_source_checkout.sh "$EXPECTED_SOURCE_SHA"
      - name: Install Python 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Exercise real hooks with python3 unavailable
        shell: bash
        run: |
          blocker="$RUNNER_TEMP/python3-blocker"
          mkdir -p "$blocker"
          printf '#!/bin/sh\nexit 127\n' > "$blocker/python3"
          chmod +x "$blocker/python3"
          export PATH="$blocker:$PATH"
          python --version
          python -m unittest discover -s tests -p 'git_preflight_tests.py'
          python -m unittest discover -s tests -p 'git_hook_python_tests.py'
