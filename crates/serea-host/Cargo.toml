[package]
name = "serea-host"
description = "Development diagnostics and native executable probe for Serea."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serea-core = { workspace = true }
serea-event-bus = { workspace = true }
serea-protocol = { workspace = true }
serea-task-engine = { workspace = true }
serea-testkit = { workspace = true, optional = true }
serea-capability = { workspace = true, optional = true }
serea-storage = { workspace = true, optional = true }
serea-model-router = { workspace = true, optional = true }
serea-scheduler = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
ctrlc = { workspace = true, optional = true }

[features]
default = []
synthetic = ["dep:serea-testkit", "dep:serea-capability", "dep:serea-storage", "dep:serea-scheduler", "dep:serea-model-router", "dep:async-trait", "dep:serde_json", "dep:fs2", "dep:getrandom", "dep:ctrlc"]
synthetic-test-hooks = ["synthetic", "serea-scheduler/test-hooks"]

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[dev-dependencies]
rusqlite = { workspace = true }
