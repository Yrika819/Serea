name: Android Personal Beta

on:
  workflow_dispatch:
    inputs:
      distribute:
        description: Send the verified Beta APK to the Owner-approved Firebase tester group.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-personal-beta
  cancel-in-progress: false

jobs:
  build-verify-attest-distribute:
    name: Build, verify, attest, and optionally distribute exact protected-main Beta
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: serea-personal-beta
    permissions:
      actions: read
      administration: read
      attestations: write
      checks: read
      contents: read
      id-token: write
    env:
      SOURCE_SHA: ${{ github.sha }}
      DISTRIBUTE_REQUESTED: ${{ inputs.distribute }}
    steps:
      - name: Check out exact workflow dispatch SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require protected Environment review and branch policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_file="$RUNNER_TEMP/serea-personal-beta-environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/serea-personal-beta" > "$environment_file"
          python3 tools/android_firebase_distribution.py verify-environment \
            --environment-file "$environment_file" \
            --name serea-personal-beta

      - name: Require active protected-main rules
        env:
          GH_TOKEN: ${{ github.token }}
          SEREA_REQUIRED_CHECKS_JSON: ${{ vars.SEREA_REQUIRED_CHECKS_JSON }}
        run: |
          set -euo pipefail
          protection_file="$RUNNER_TEMP/serea-main-branch-protection.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main/protection" > "$protection_file"
          python3 tools/android_firebase_distribution.py verify-main-protection \
            --protection-file "$protection_file"

      - name: Verify protected-main source and record provenance
        id: source
        env:
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          python3 tools/android_firebase_distribution.py validate-source \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --source-sha "$SOURCE_SHA" \
            --checkout-sha "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
          tree_sha=$(git rev-parse "${SOURCE_SHA}^{tree}")
          workflow_path="${GITHUB_WORKFLOW_REF%%@*}"
          printf 'source_tree_sha=%s\n' "$tree_sha" >> "$GITHUB_OUTPUT"
          printf 'SOURCE_TREE_SHA=%s\n' "$tree_sha" >> "$GITHUB_ENV"
          printf 'WORKFLOW_PATH=%s\n' "$workflow_path" >> "$GITHUB_ENV"

      - name: Record numeric workflow ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.workflow_id')
          [[ "$workflow_id" =~ ^[0-9]+$ ]]
          printf 'WORKFLOW_ID=%s\n' "$workflow_id" >> "$GITHUB_ENV"

      - name: Assign monotonic Personal Beta versionCode
        id: version
        env:
          SEREA_PERSONAL_BETA_VERSION_CODE_BASELINE: ${{ vars.SEREA_PERSONAL_BETA_VERSION_CODE_BASELINE }}
        run: |
          set -euo pipefail
          python3 tools/android_firebase_distribution.py version-code \
            --run-number "$GITHUB_RUN_NUMBER" --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Require all Owner-configured checks on the exact source SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SEREA_REQUIRED_CHECKS_JSON: ${{ vars.SEREA_REQUIRED_CHECKS_JSON }}
        run: |
          set -euo pipefail
          check_file="$RUNNER_TEMP/serea-personal-beta-check-runs.json"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs?per_page=100" \
            --jq '.check_runs[]' | jq -s '{check_runs: .}' > "$check_file"
          python3 tools/android_firebase_distribution.py check-required --check-runs "$check_file"

      - name: Require protected signing and optional distribution settings
        env:
          SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_BASE64: ${{ secrets.SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_BASE64 }}
          SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_PASSWORD: ${{ secrets.SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_PASSWORD }}
          SEREA_ANDROID_PERSONAL_BETA_KEY_ALIAS: ${{ secrets.SEREA_ANDROID_PERSONAL_BETA_KEY_ALIAS }}
          SEREA_ANDROID_PERSONAL_BETA_KEY_PASSWORD: ${{ secrets.SEREA_ANDROID_PERSONAL_BETA_KEY_PASSWORD }}
          SEREA_ANDROID_PERSONAL_BETA_CERT_SHA256: ${{ vars.SEREA_ANDROID_PERSONAL_BETA_CERT_SHA256 }}
          SEREA_PERSONAL_BETA_VERSION_CODE_BASELINE: ${{ vars.SEREA_PERSONAL_BETA_VERSION_CODE_BASELINE }}
          SEREA_REQUIRED_CHECKS_JSON: ${{ vars.SEREA_REQUIRED_CHECKS_JSON }}
          SEREA_FIREBASE_DISTRIBUTION_ENABLED: ${{ vars.SEREA_FIREBASE_DISTRIBUTION_ENABLED }}
          SEREA_GCP_WIF_PROVIDER: ${{ vars.SEREA_GCP_WIF_PROVIDER }}
          SEREA_GCP_SERVICE_ACCOUNT: ${{ vars.SEREA_GCP_SERVICE_ACCOUNT }}
          SEREA_FIREBASE_PROJECT_ID: ${{ vars.SEREA_FIREBASE_PROJECT_ID }}
          SEREA_FIREBASE_APP_ID: ${{ vars.SEREA_FIREBASE_APP_ID }}
          SEREA_FIREBASE_APPROVED_TESTER_GROUP: ${{ vars.SEREA_FIREBASE_APPROVED_TESTER_GROUP }}
        run: python3 tools/android_firebase_distribution.py preflight --distribute-requested "$DISTRIBUTE_REQUESTED"

      - name: Mask Firebase distribution identifiers
        if: inputs.distribute
        env:
          SEREA_FIREBASE_APPROVED_TESTER_GROUP: ${{ vars.SEREA_FIREBASE_APPROVED_TESTER_GROUP }}
          SEREA_GCP_SERVICE_ACCOUNT: ${{ vars.SEREA_GCP_SERVICE_ACCOUNT }}
          SEREA_GCP_WIF_PROVIDER: ${{ vars.SEREA_GCP_WIF_PROVIDER }}
        shell: bash
        run: |
          printf '::add-mask::%s\n' "$SEREA_FIREBASE_APPROVED_TESTER_GROUP"
          printf '::add-mask::%s\n' "$SEREA_GCP_SERVICE_ACCOUNT"
          printf '::add-mask::%s\n' "$SEREA_GCP_WIF_PROVIDER"

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK build tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Node for the pinned Firebase CLI
        if: inputs.distribute
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install Firebase CLI without package lifecycle scripts
        if: inputs.distribute
        shell: bash
        run: |
          set -euo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          cli_dir="$RUNNER_TEMP/serea-firebase-cli"
          install -d -m 700 "$cli_dir"
          cp tools/firebase-distribution/package.json tools/firebase-distribution/package-lock.json "$cli_dir/"
          (cd "$cli_dir" && npm ci --ignore-scripts --no-audit --no-fund)
          printf '%s\n' "$cli_dir/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Materialize Owner Beta keystore in runner temporary storage
        env:
          SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_BASE64: ${{ secrets.SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/serea-personal-beta-key"
          install -d -m 700 "$key_dir"
          key_file="$key_dir/personal-beta.p12"
          umask 077
          printf '%s' "$SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_BASE64" | base64 --decode 2>/dev/null > "$key_file"
          test -s "$key_file"
          chmod 600 "$key_file"
          printf 'SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_PATH=%s\n' "$key_file" >> "$GITHUB_ENV"

      - name: Build the Owner-signed Personal Beta variant
        working-directory: android
        env:
          SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_PASSWORD: ${{ secrets.SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_PASSWORD }}
          SEREA_ANDROID_PERSONAL_BETA_KEY_ALIAS: ${{ secrets.SEREA_ANDROID_PERSONAL_BETA_KEY_ALIAS }}
          SEREA_ANDROID_PERSONAL_BETA_KEY_PASSWORD: ${{ secrets.SEREA_ANDROID_PERSONAL_BETA_KEY_PASSWORD }}
          SEREA_ANDROID_PERSONAL_BETA_CERT_SHA256: ${{ vars.SEREA_ANDROID_PERSONAL_BETA_CERT_SHA256 }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache clean \
            :app:validatePersonalBetaSigning :app:assembleBeta \
            "-PsereaBetaVersionCode=${{ steps.version.outputs.version_code }}"

      - name: Verify Beta APK identity, checksum, and Owner certificate
        id: apk
        env:
          SEREA_ANDROID_PERSONAL_BETA_CERT_SHA256: ${{ vars.SEREA_ANDROID_PERSONAL_BETA_CERT_SHA256 }}
          BUILD_TOOLS_VERSION: '35.0.0'
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/beta/app-beta.apk'
          test -s "$apk"
          python3 tools/android_firebase_distribution.py verify \
            --apk "$apk" \
            --application-id app.serea.android.beta \
            --version-code '${{ steps.version.outputs.version_code }}' \
            --aapt "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          {
            echo 'application_id=app.serea.android.beta'
            echo 'distribution_apk_location=runner_temp_only'
            echo "version_code=${{ steps.version.outputs.version_code }}"
            echo "source_commit_sha=$SOURCE_SHA"
            echo "source_tree_sha=$SOURCE_TREE_SHA"
            echo "apk_sha256=$(sha256sum "$apk" | awk '{print $1}')"
            echo 'signed_apk_actions_artifact=none'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish build provenance attestation for the APK digest
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: android/app/build/outputs/apk/beta/app-beta.apk
          push-to-registry: false

      - name: Authenticate to Google Cloud using Workload Identity Federation
        id: firebase-auth
        if: inputs.distribute && steps.provenance.outcome == 'success'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.SEREA_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.SEREA_GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Confirm Firebase app ID is registered for the Beta package
        id: firebase-app
        if: inputs.distribute && steps.firebase-auth.outcome == 'success'
        env:
          FIREBASE_CLI: firebase
          SEREA_FIREBASE_PROJECT_ID: ${{ vars.SEREA_FIREBASE_PROJECT_ID }}
          SEREA_FIREBASE_APP_ID: ${{ vars.SEREA_FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          firebase apps:list android --project "$SEREA_FIREBASE_PROJECT_ID" --json \
            > "$RUNNER_TEMP/serea-firebase-android-apps.json"
          python3 tools/android_firebase_distribution.py verify-firebase-app \
            --apps-file "$RUNNER_TEMP/serea-firebase-android-apps.json" \
            --app-id "$SEREA_FIREBASE_APP_ID" \
            --package-name app.serea.android.beta

      - name: Create generic Firebase release notes
        if: inputs.distribute && steps.firebase-app.outcome == 'success' && steps.apk.outcome == 'success'
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/serea-personal-beta-release-notes.txt"
          printf 'Serea Personal Beta build %s. Source %s.\n' \
            '${{ steps.version.outputs.version_code }}' "$SOURCE_SHA" > "$notes"
          chmod 600 "$notes"
          printf 'SEREA_FIREBASE_RELEASE_NOTES_FILE=%s\n' "$notes" >> "$GITHUB_ENV"

      - name: Distribute the verified APK directly to the approved Firebase group
        id: firebase
        if: inputs.distribute && steps.firebase-auth.outcome == 'success' && steps.firebase-app.outcome == 'success' && steps.apk.outcome == 'success'
        env:
          FIREBASE_CLI: firebase
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          SEREA_FIREBASE_APP_ID: ${{ vars.SEREA_FIREBASE_APP_ID }}
          SEREA_FIREBASE_APPROVED_TESTER_GROUP: ${{ vars.SEREA_FIREBASE_APPROVED_TESTER_GROUP }}
          SEREA_FIREBASE_DISTRIBUTION_ENABLED: ${{ vars.SEREA_FIREBASE_DISTRIBUTION_ENABLED }}
        run: |
          set -euo pipefail
          python3 tools/android_firebase_distribution.py distribute \
            --apk android/app/build/outputs/apk/beta/app-beta.apk \
            --expected-sha256 '${{ steps.apk.outputs.apk_sha256 }}' \
            --release-notes-file "$SEREA_FIREBASE_RELEASE_NOTES_FILE" \
            --result-file "$RUNNER_TEMP/serea-personal-beta-distribution-result.txt"

      - name: Record provenance and Firebase result
        if: always()
        env:
          VERIFIED_APPLICATION_ID: ${{ steps.apk.outputs.application_id }}
          VERIFIED_VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          VERIFIED_APK_SHA256: ${{ steps.apk.outputs.apk_sha256 }}
          VERIFIED_CERTIFICATE_SHA256: ${{ steps.apk.outputs.certificate_sha256 }}
          APK_VERIFY_OUTCOME: ${{ steps.apk.outcome }}
          FIREBASE_AUTH_OUTCOME: ${{ steps.firebase-auth.outcome }}
          FIREBASE_APP_VERIFY_OUTCOME: ${{ steps.firebase-app.outcome }}
          SEREA_FIREBASE_APP_ID: ${{ vars.SEREA_FIREBASE_APP_ID }}
        run: |
          python3 tools/android_firebase_distribution.py report \
            --distribute-requested "$DISTRIBUTE_REQUESTED" \
            --result-file "$RUNNER_TEMP/serea-personal-beta-distribution-result.txt" \
            --apk-outcome "$APK_VERIFY_OUTCOME" \
            --auth-outcome "$FIREBASE_AUTH_OUTCOME" \
            --firebase-app-outcome "$FIREBASE_APP_VERIFY_OUTCOME"

      - name: Remove signing key, private CLI output, and APK build outputs
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf "$RUNNER_TEMP/serea-personal-beta-key" \
            "$RUNNER_TEMP/serea-firebase-cli" \
            "$RUNNER_TEMP/serea-personal-beta-release-notes.txt" \
            "$RUNNER_TEMP/serea-personal-beta-check-runs.json" \
            "$RUNNER_TEMP/serea-personal-beta-environment.json" \
            "$RUNNER_TEMP/serea-main-branch-protection.json" \
            "$RUNNER_TEMP/serea-firebase-android-apps.json" \
            "$RUNNER_TEMP/serea-personal-beta-distribution-result.txt" \
            android/app/build
          rm -f "$RUNNER_TEMP"/gha-creds-*.json
