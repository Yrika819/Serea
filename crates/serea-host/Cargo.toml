[package]
name = "serea-host"
description = "Development diagnostics and native executable probe for Serea."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serea-core = { workspace = true }
serea-event-bus = { workspace = true }
serea-protocol = { workspace = true }
serea-task-engine = { workspace = true }
serea-testkit = { workspace = true, optional = true }
serea-capability = { workspace = true, optional = true }
serea-storage = { workspace = true, optional = true }

[features]
default = []
synthetic = ["dep:serea-testkit", "dep:serea-capability", "dep:serea-storage"]

