name: Fast CI

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit SHA for the identity check
        required: true
        type: string
      head_sha:
        description: Exact checked-out head commit SHA for the identity check
        required: true
        type: string
  pull_request:
  push:
    branches: [main, 'p3/**']

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    env:
      SEREA_EVENT_NAME: ${{ github.event_name }}
      SEREA_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SEREA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SEREA_PUSH_BEFORE_SHA: ${{ github.event.before }}
      SEREA_PUSH_AFTER_SHA: ${{ github.sha }}
      SEREA_DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
      SEREA_DISPATCH_HEAD_SHA: ${{ inputs.head_sha }}
      SEREA_DISPATCH_REF_SHA: ${{ github.sha }}
    name: Linux fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Print toolchain versions
        run: |
          rustup run stable rustc --version
          rustup run stable cargo --version

      - name: Fetch locked dependencies
        run: cargo +stable fetch --locked

      - name: Workspace smoke guard
        run: python3 tests/workspace_smoke.py

      - name: Workspace smoke regression tests
        run: python3 -m unittest discover -s tests -p workspace_smoke_tests.py

      - name: Commit identity guard
        run: python3 tools/check_commit_identity.py

      - name: Commit identity guard tests
        run: python3 -m unittest discover -s tests -p commit_identity_tests.py

      - name: Git preflight regression tests
        run: python3 -m unittest discover -s tests -p git_preflight_tests.py

      - name: Git hook Python launcher tests
        run: python3 -m unittest discover -s tests -p git_hook_python_tests.py

      - name: Validate documentation
        run: python3 tools/validate_docs.py docs

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Check Cargo metadata
        run: cargo +stable metadata --no-deps --format-version 1 --offline

      - name: Check workspace
        run: cargo +stable check --workspace --all-targets --all-features --offline
