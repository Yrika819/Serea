name: Android Personal Beta Contract Tests

on:
  pull_request:
    paths:
      - '.github/workflows/android-personal-beta.yml'
      - '.github/workflows/android-personal-beta-contract-tests.yml'
      - '.github/workflows/android.yml'
      - 'android/app/build.gradle.kts'
      - 'tools/android_firebase_distribution.py'
      - 'tools/firebase-distribution/**'
      - 'tools/assert_disposable_android_emulator.sh'
      - 'tools/test_android_update_compatibility.sh'
      - 'tools/test_android_update_compatibility_guard.sh'
      - 'tools/android_beta_release.py'
      - 'tools/install_pinned_android_release_tools.sh'
      - 'tools/install_pinned_gh_cli.sh'
      - 'tools/run_pinned_osv_scanner.sh'
      - 'tools/test_android_beta_release_pipeline.sh'
      - 'tests/android_firebase_distribution_tests.py'
      - 'tests/android_beta_release_tests.py'
      - 'docs/security/ANDROID-BETA-SIGNING-ISOLATION.md'

permissions:
  contents: read

concurrency:
  group: android-personal-beta-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mock-contract-tests:
    name: Mock Personal Beta Signing and Firebase Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out pull request source without secrets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install checksum-pinned actionlint
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/serea-actionlint"
          mkdir -m 700 "$tool_dir"
          curl --silent --show-error --fail --location --proto '=https' --tlsv1.2 \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.9/actionlint_1.7.9_linux_amd64.tar.gz' \
            --output "$tool_dir/actionlint.tar.gz"
          printf '%s  %s\n' '233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4' \
            "$tool_dir/actionlint.tar.gz" | sha256sum --check --status
          curl --silent --show-error --fail --location --proto '=https' --tlsv1.2 \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.9/actionlint_1.7.9_checksums.txt' \
            --output "$tool_dir/checksums.txt"
          printf '%s  %s\n' 'c0722602c622050fec2fdfbdc5fc4eb17a3b3fb62ea82dc38ea3d3c8cb48d769' \
            "$tool_dir/checksums.txt" | sha256sum --check --status
          grep -E '^233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4[[:space:]]+actionlint_1\.7\.9_linux_amd64\.tar\.gz$' \
            "$tool_dir/checksums.txt" >/dev/null
          tar -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir"
          "$tool_dir/actionlint" .github/workflows/android-personal-beta.yml \
            .github/workflows/android-personal-beta-contract-tests.yml

      - name: Set up JDK 17 for the unsigned Beta build
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK for the unsigned Beta build
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android 35 and Build Tools 35.0.0
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Assemble and verify unsigned Beta package identity
        run: |
          set -euo pipefail
          cd android
          env -u SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_PATH \
            -u SEREA_ANDROID_PERSONAL_BETA_KEYSTORE_PASSWORD \
            -u SEREA_ANDROID_PERSONAL_BETA_KEY_ALIAS \
            -u SEREA_ANDROID_PERSONAL_BETA_KEY_PASSWORD \
            -u SEREA_ANDROID_PERSONAL_BETA_CERT_SHA256 \
            ./gradlew --no-daemon --no-build-cache --no-configuration-cache clean \
            :app:assembleBeta -PsereaBetaVersionCode=101
          mapfile -t apks < <(find app/build/outputs/apk/beta -maxdepth 1 -type f -name '*.apk' -print)
          [[ "${#apks[@]}" == 1 ]]
          apk="${apks[0]}"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" \
            | grep -F "package: name='app.serea.android.beta' versionCode='101'" >/dev/null
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk" \
            > "$RUNNER_TEMP/serea-beta-apksigner.txt" 2>&1; then
            echo 'assembleBeta unexpectedly produced a signed APK.' >&2
            exit 1
          fi
          grep -F 'DOES NOT VERIFY' "$RUNNER_TEMP/serea-beta-apksigner.txt" >/dev/null
          sha256sum "$apk"
          rm -f "$RUNNER_TEMP/serea-beta-apksigner.txt"

      - name: Run mock Firebase and signing contract tests
        run: python3 -m unittest discover -s tests -p android_firebase_distribution_tests.py

      - name: Run isolated Beta signer and OSV negative contract tests
        run: python3 -m unittest discover -s tests -p android_beta_release_tests.py

      - name: Run disposable-key APK signing and encrypted handoff E2E
        run: bash tools/test_android_beta_release_pipeline.sh

      - name: Test update emulator guard using Mock ADB
        run: bash tools/test_android_update_compatibility_guard.sh

      - name: Check release and disposable-emulator shell syntax
        run: |
          for script in \
            tools/assert_disposable_android_emulator.sh \
            tools/test_android_update_compatibility.sh \
            tools/test_android_update_compatibility_guard.sh \
            tools/install_pinned_android_release_tools.sh \
            tools/install_pinned_gh_cli.sh \
            tools/run_pinned_osv_scanner.sh \
            tools/test_android_beta_release_pipeline.sh \
            tools/test_personal_beta_identity.sh \
            tools/verify_personal_beta_apk.sh; do
            bash -n "$script"
          done
