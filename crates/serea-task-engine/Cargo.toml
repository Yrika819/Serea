[package]
name = "serea-task-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serea-protocol.workspace = true
serea-storage.workspace = true
serea-event-bus.workspace = true

[dev-dependencies]
serde_json.workspace = true
rusqlite.workspace = true
serea-testkit.workspace = true
# P2H: enables storage's test-only crash/fault seam for this crate's crash
# harness. It is requested only from test-target dev-dependency edges in the
# task-engine and model-router crates. Cargo's resolver v2 keeps the runtime
# dependency edges unchanged, so `cargo build --release` compiles storage
# without the seam.
serea-storage = { workspace = true, features = ["p2h-fault-injection"] }
