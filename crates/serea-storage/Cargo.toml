[package]
name = "serea-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# P2H crash/fault seam. Deliberately empty and deliberately NOT a default
# feature. The workspace requests it only from test-target dev-dependency
# edges, so normal/default production builds exclude its window and arming API.
# A build that explicitly opts into this feature contains the seam; the release
# proof records that boundary in `docs/plans/P2H-review-and-closure.md`.
p2h-fault-injection = []

[dependencies]
serea-protocol.workspace = true
rusqlite.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
