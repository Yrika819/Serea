[package]
name = "serea-task-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serea-protocol.workspace = true
serea-storage.workspace = true

[dev-dependencies]
serde_json.workspace = true
rusqlite.workspace = true
# P2H: enables storage's test-only crash/fault seam for this crate's crash
# harness. This is the ONLY place the feature is requested anywhere in the
# workspace, and it is a dev-dependency edge, so Cargo's resolver v2 unifies it
# only when building test targets. The engine's runtime dependency edge is
# unchanged, so `cargo build --release` compiles storage without the seam.
serea-storage = { workspace = true, features = ["p2h-fault-injection"] }
