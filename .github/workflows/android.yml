name: Android

on:
  pull_request:
    paths:
      - 'android/**'
      - 'docs/decisions/ADR-0044-*'
      - 'docs/decisions/ADR-0045-*'
      - 'docs/plans/2026-ANDROID-PHASE2-*'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'docs/decisions/ADR-0044-*'
      - 'docs/decisions/ADR-0045-*'
      - 'docs/plans/2026-ANDROID-PHASE2-*'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Android Build, Lint, and Instrumentation Compile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug, release, and instrumentation APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Android lint
        working-directory: android
        run: ./gradlew --no-daemon lintDebug
      - name: Upload APKs and lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serea-android-phase2-build
          if-no-files-found: warn
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/androidTest/**/*.apk
            android/app/build/reports/lint-results-debug.html

  android-unit:
    name: Android Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: ViewModel state and cancellation tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest --tests '*ChatViewModelTest'
      - name: Upload unit JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serea-android-unit-junit
          if-no-files-found: warn
          path: android/app/build/test-results/testDebugUnitTest/*.xml

  android-integration:
    name: Android Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Mock HTTP provider contract tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest --tests '*OllamaCloudAdapterTest'
      - name: Upload provider JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serea-android-integration-junit
          if-no-files-found: warn
          path: android/app/build/test-results/testDebugUnitTest/*.xml

  android-security:
    name: Android Security Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Egress allow and deny contract tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest --tests '*SecurityPortsTest'
      - name: Upload security JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serea-android-security-junit
          if-no-files-found: warn
          path: android/app/build/test-results/testDebugUnitTest/*.xml

  android-storage-emulator:
    name: Android Storage and Emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install Android emulator and API 35 packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Start API 35 Pixel emulator
        id: emulator
        timeout-minutes: 20
        run: |
          if [ -r /dev/kvm ]; then
            accel_mode=auto
            echo "The runner exposes /dev/kvm; starting hardware-accelerated API 35 emulator." >> "$GITHUB_STEP_SUMMARY"
          else
            accel_mode=off
            echo "### Android emulator smoke: software acceleration fallback" >> "$GITHUB_STEP_SUMMARY"
            echo "The runner does not expose readable /dev/kvm. Trying software CPU emulation; this may be slower." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo no | avdmanager create avd --force --name serea-api35 --package 'system-images;android-35;google_apis;x86_64' --device pixel_7
          adb start-server
          emulator -avd serea-api35 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -accel "$accel_mode" > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          deadline=$((SECONDS + 900))
          booted=false
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              if [ "$accel_mode" = "off" ]; then
                echo "ready=false" >> "$GITHUB_OUTPUT"
                {
                  echo "### Android emulator smoke: NOT_RUN"
                  echo "No KVM is exposed by the runner and the software-accelerated emulator exited before boot. The APK compile job remains the available Android platform check. Emulator log tail:"
                  echo '```text'
                  tail -n 15 "$RUNNER_TEMP/emulator.log"
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "Android emulator exited before boot completed. Diagnostic log follows:" >&2
              cat "$RUNNER_TEMP/emulator.log" >&2
              exit 1
            fi
            if timeout 5 adb -s emulator-5554 get-state >/dev/null 2>&1; then
              boot_state=$(timeout 5 adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$boot_state" = "1" ]; then booted=true; break; fi
            fi
            sleep 3
          done
          if [ "$booted" != "true" ]; then
            if [ "$accel_mode" = "off" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              {
                echo "### Android emulator smoke: NOT_RUN"
                echo "No KVM is exposed by the runner and software CPU emulation did not reach boot completion within 15 minutes. The APK compile job remains the available Android platform check. Emulator log tail:"
                echo '```text'
                tail -n 15 "$RUNNER_TEMP/emulator.log"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Android emulator did not reach sys.boot_completed before the startup deadline. Diagnostic log follows:" >&2
            cat "$RUNNER_TEMP/emulator.log" >&2
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "API 35 Pixel emulator booted with -accel $accel_mode." >> "$GITHUB_STEP_SUMMARY"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Run Room, Keystore, manifest, and Compose instrumentation tests
        if: steps.emulator.outputs.ready == 'true'
        working-directory: android
        run: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Upload emulator evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serea-android-emulator-evidence
          if-no-files-found: warn
          path: |
            android/app/build/outputs/androidTest-results/connected/**/*.xml
            android/app/build/reports/androidTests/connected/**/*.html
            ${{ runner.temp }}/emulator.log

  android-documentation:
    name: Android Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate documentation and links
        run: python3 tools/validate_docs.py docs

  android-dependency-audit:
    name: Android Dependency Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Resolve locked Android dependencies
        working-directory: android
        run: ./gradlew --no-daemon :app:dependencies :app:generateLicenseReport > "$RUNNER_TEMP/android-dependency-audit.log" 2>&1
      - name: Scan Android dependency vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@8018483926dd235b3013d8c88023e644b9f8e09e # v2.3.3
        with:
          scan-args: |-
            --format=json
            --output=osv-android-dependencies.json
            --recursive
            android/
      - name: Upload dependency audit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serea-android-dependency-audit
          if-no-files-found: warn
          path: |
            osv-android-dependencies.json
            android/app/build/reports/dependency-license/**
            ${{ runner.temp }}/android-dependency-audit.log
