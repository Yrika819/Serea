name: Android protected internal Beta signing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-internal-beta-signing
  cancel-in-progress: false

jobs:
  sign-internal-beta:
    name: Build and verify owner-signed internal Beta APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: android-internal-beta
    steps:
      - name: Check out the exact trusted dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK build tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Require owner-managed signing configuration
        env:
          SEREA_ANDROID_KEYSTORE_BASE64: ${{ secrets.SEREA_ANDROID_KEYSTORE_BASE64 }}
          SEREA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SEREA_ANDROID_KEYSTORE_PASSWORD }}
          SEREA_ANDROID_KEY_ALIAS: ${{ secrets.SEREA_ANDROID_KEY_ALIAS }}
          SEREA_ANDROID_KEY_PASSWORD: ${{ secrets.SEREA_ANDROID_KEY_PASSWORD }}
          SEREA_ANDROID_SIGNING_CERT_SHA256: ${{ vars.SEREA_ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in SEREA_ANDROID_KEYSTORE_BASE64 SEREA_ANDROID_KEYSTORE_PASSWORD SEREA_ANDROID_KEY_ALIAS SEREA_ANDROID_KEY_PASSWORD SEREA_ANDROID_SIGNING_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "Internal Beta signing is NOT_RUN: required protected Environment setting $name is missing."
              exit 1
            fi
          done
          fingerprint=$(printf '%s' "$SEREA_ANDROID_SIGNING_CERT_SHA256" | tr -d ':[:space:]')
          if ! [[ "$fingerprint" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo 'Internal Beta signing is NOT_RUN: expected certificate fingerprint is not 64 hexadecimal characters.'
            exit 1
          fi

      - name: Materialize the protected keystore in runner temporary storage
        env:
          SEREA_ANDROID_KEYSTORE_BASE64: ${{ secrets.SEREA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/serea-internal-beta-key"
          install -d -m 700 "$key_dir"
          key_file="$key_dir/owner-signing.p12"
          umask 077
          printf '%s' "$SEREA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          test -s "$key_file"
          chmod 600 "$key_file"
          printf 'SEREA_ANDROID_KEYSTORE_PATH=%s\n' "$key_file" >> "$GITHUB_ENV"

      - name: Build the protected internal Beta variant
        working-directory: android
        env:
          SEREA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SEREA_ANDROID_KEYSTORE_PASSWORD }}
          SEREA_ANDROID_KEY_ALIAS: ${{ secrets.SEREA_ANDROID_KEY_ALIAS }}
          SEREA_ANDROID_KEY_PASSWORD: ${{ secrets.SEREA_ANDROID_KEY_PASSWORD }}
          SEREA_ANDROID_SIGNING_CERT_SHA256: ${{ vars.SEREA_ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          version_code=$((GITHUB_RUN_NUMBER + 1))
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache clean :app:verifyInternalBetaSigning :app:assembleInternalBeta "-PsereaVersionCode=$version_code"

      - name: Verify APK identity, signature, and provenance
        env:
          BUILD_TOOLS_VERSION: 35.0.0
          SEREA_ANDROID_SIGNING_CERT_SHA256: ${{ vars.SEREA_ANDROID_SIGNING_CERT_SHA256 }}
          SOURCE_COMMIT_SHA: ${{ github.sha }}
          BUILD_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT_SHA"
          test "$BUILD_COMMIT_SHA" = "$SOURCE_COMMIT_SHA"
          version_code=$((GITHUB_RUN_NUMBER + 1))
          apk='android/app/build/outputs/apk/internalBeta/app-internalBeta.apk'
          test -s "$apk"
          output_dir="$RUNNER_TEMP/serea-internal-beta-output"
          install -d -m 700 "$output_dir"
          aapt="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt"
          apksigner="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          badging="$RUNNER_TEMP/serea-internal-beta-badging.txt"
          signature="$RUNNER_TEMP/serea-internal-beta-signature.txt"
          "$aapt" dump badging "$apk" > "$badging"
          grep -F "package: name='app.serea.android.demo'" "$badging" >/dev/null
          grep -F "versionCode='$version_code'" "$badging" >/dev/null
          "$apksigner" verify --verbose --print-certs "$apk" > "$signature"
          actual_fingerprint=$(awk -F ': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' "$signature" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          expected_fingerprint=$(printf '%s' "$SEREA_ANDROID_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "${#actual_fingerprint}" -eq 64
          test "$actual_fingerprint" = "$expected_fingerprint"
          apk_sha256=$(sha256sum "$apk" | awk '{print $1}')
          cp "$apk" "$output_dir/serea-android-internal-beta.apk"
          {
            echo 'application_id=app.serea.android.demo'
            echo "version_code=$version_code"
            echo 'apk_signature_verification=PASS'
            echo "apk_sha256=$apk_sha256"
            echo "certificate_sha256=$actual_fingerprint"
            echo "source_commit_sha=$SOURCE_COMMIT_SHA"
            echo "build_commit_sha=$BUILD_COMMIT_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "workflow_ref=$GITHUB_REF"
            echo 'signing_key_material_in_artifact=no'
          } > "$output_dir/provenance.txt"
          cat "$output_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified APK and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serea-android-internal-beta-${{ github.run_number }}
          path: ${{ runner.temp }}/serea-internal-beta-output/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/serea-internal-beta-key" "$RUNNER_TEMP/serea-internal-beta-output" "$RUNNER_TEMP/serea-internal-beta-signature.txt" "$RUNNER_TEMP/serea-internal-beta-badging.txt"
