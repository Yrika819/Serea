name: G10-B1 isolated Native Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/app/src/main/cpp/**'
      - 'android/app/src/main/java/app/serea/android/LocalModelNativeRuntime.kt'
      - 'android/app/src/main/java/app/serea/android/LocalModelChatAdapter.kt'
      - 'android/app/src/main/java/app/serea/android/LocalModelSecurity.kt'
      - 'android/app/src/main/java/app/serea/android/LocalModelMemoryLifecycle.kt'
      - 'android/app/src/debug/java/app/serea/android/ProcessDeathHarnessReceiver.kt'
      - 'android/app/src/nativeRuntimeDiagnosticAndroidTest/java/app/serea/android/NativeGgufLifecycleTest.kt'
      - 'android/app/src/test/java/app/serea/android/LocalModelChatAdapterTest.kt'
      - 'android/app/src/test/java/app/serea/android/LocalModelMemoryLifecycleTest.kt'
      - 'android/app/src/test/java/app/serea/android/NativeReleaseCoordinatorTest.kt'
      - 'android/app/src/test/java/app/serea/android/LocalModelNativeRuntimeLifecycleTest.kt'
      - 'android/app/src/nativeRuntimeDiagnosticAndroidTest/**'
      - 'android/app/build.gradle.kts'
      - 'tools/fetch_verified_smollm2_test_model.py'
      - 'tools/run_native_gguf_integration.sh'
      - 'tools/run_native_jni_contract.sh'
      - 'docs/agent-reports/g10-b1-native-supply-chain.md'
      - '.github/workflows/g10-b1-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-native:
    name: Isolated llama.cpp ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [x86_64, arm64-v8a]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install pinned Android native toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358' 'cmake;3.31.6'
      - name: Fetch exact llama.cpp source revision
        run: |
          git init "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth=1 origin 276378515ceebee5d14bcc8536603dd5c87491a2
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/llama.cpp" rev-parse HEAD)" = 276378515ceebee5d14bcc8536603dd5c87491a2
          test -z "$(git -C "$RUNNER_TEMP/llama.cpp" status --porcelain --untracked-files=all)"
      - name: Verify opt-in variant isolation
        run: ./android/gradlew -p android --no-daemon :app:verifyLocalNativeRuntimeVariantIsolation -PsereaIsolatedNativeRuntime=true
      - name: Build isolated APK for one ABI
        run: ./android/gradlew -p android --no-daemon :app:assembleIsolated -PsereaIsolatedNativeRuntime=true -PsereaLlamaCppSource="$RUNNER_TEMP/llama.cpp" -PsereaNativeRuntimeAbi='${{ matrix.abi }}'
      - name: Verify APK contains only requested Native ABI
        env:
          SEREA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          apk=android/app/build/outputs/apk/isolated/app-isolated.apk
          test -s "$apk"
          unzip -l "$apk" | tee "$RUNNER_TEMP/apk-files.txt"
          grep -q "lib/${{ matrix.abi }}/libserea_local_llama.so" "$RUNNER_TEMP/apk-files.txt"
          if grep 'lib/.*libserea_local_llama.so' "$RUNNER_TEMP/apk-files.txt" | grep -v "lib/${{ matrix.abi }}/"; then
            echo 'Unexpected Native ABI packaged' >&2; exit 1
          fi
          llvm_readelf="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          native_so="$RUNNER_TEMP/libserea_local_llama.so"
          unzip -p "$apk" "lib/${{ matrix.abi }}/libserea_local_llama.so" > "$native_so"
          test -s "$native_so"
          "$llvm_readelf" -h -d "$native_so" | tee "$RUNNER_TEMP/native-library-report.txt"
          case '${{ matrix.abi }}' in
            arm64-v8a) grep -q 'Machine:.*AArch64' "$RUNNER_TEMP/native-library-report.txt" ;;
            x86_64) grep -q 'Machine:.*Advanced Micro Devices X86-64' "$RUNNER_TEMP/native-library-report.txt" ;;
          esac
          awk -F'[][]' '/NEEDED/ { print $2 }' "$RUNNER_TEMP/native-library-report.txt" | sort -u > "$RUNNER_TEMP/native-needed-libraries.txt"
          while IFS= read -r dependency; do
            case "$dependency" in
              libc.so|libc++_shared.so|libdl.so|liblog.so|libm.so|libandroid.so|libz.so|libatomic.so) ;;
              *) echo "Unexpected Native shared dependency: $dependency" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/native-needed-libraries.txt"
          ! grep -Eiq 'lib(llama|ggml).*\.so' "$RUNNER_TEMP/native-needed-libraries.txt"
          sha256sum "$native_so" | tee "$RUNNER_TEMP/native-library.sha256"
          {
            printf 'PR_HEAD_SHA=%s\n' "$SEREA_PR_HEAD_SHA"
            printf 'CI_CHECKOUT_SHA=%s\n' "$(git rev-parse HEAD)"
            sha256sum android/app/src/main/cpp/llama_jni.cpp android/app/src/main/cpp/CMakeLists.txt
          } > "$RUNNER_TEMP/native-source-provenance.txt"
          sha256sum "$apk" | tee "$RUNNER_TEMP/apk.sha256"
      - name: Fetch and verify pinned public GGUF test fixture
        if: matrix.abi == 'x86_64'
        run: python3 tools/fetch_verified_smollm2_test_model.py "$RUNNER_TEMP/serea-r7-smollm2-135m-q4_k_m.gguf"
      - name: Install API 35 emulator image for the JNI ownership smoke test
        if: matrix.abi == 'x86_64'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'system-images;android-35;google_apis;x86_64' 'build-tools;35.0.0' emulator
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Run no-model and real-GGUF JNI contracts on API 35 x86_64
        if: matrix.abi == 'x86_64'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          SEREA_DISPOSABLE_CI_EMULATOR: '1'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          working-directory: android
          script: |
            bash ../tools/run_native_jni_contract.sh
            bash ../tools/run_native_gguf_integration.sh "$RUNNER_TEMP/serea-r7-smollm2-135m-q4_k_m.gguf"
            # The real-model test deliberately ends with an injected JNI free refusal. The
            # script force-stops that isolated app; this final no-model probe verifies a fresh
            # process starts with empty Native ownership after process teardown.
            bash ../tools/run_native_jni_contract.sh
      - name: Record Native JNI diagnostic provenance
        if: always() && matrix.abi == 'x86_64'
        env:
          SEREA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-gguf-diagnostics"
          {
            printf 'PR_HEAD_SHA=%s\n' "$SEREA_PR_HEAD_SHA"
            printf 'CI_CHECKOUT_SHA=%s\n' "$(git rev-parse HEAD)"
            printf 'WORKFLOW_RUN_ID=%s\n' "$GITHUB_RUN_ID"
            printf 'WORKFLOW_ATTEMPT=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'MODEL_REPOSITORY=ggml-org/SmolLM2-135M-GGUF\n'
            printf 'MODEL_REVISION=1076b85d135017971845b19b8d07df1479155988\n'
            printf 'MODEL_FILE=SmolLM2-135M-Q4_K_M.gguf\nMODEL_LICENSE=Apache-2.0\nMODEL_SIZE_BYTES=101016128\nMODEL_SHA256=e3131339bf4e8065265593d4fd8f7bb7ff2d3abff1edb5618aa1197b89cad9f5\n'
            printf 'LLAMA_CPP_REVISION=276378515ceebee5d14bcc8536603dd5c87491a2\n'
            printf 'RUNNER_IMAGE=%s\n' "$ImageOS $ImageVersion"
            printf 'GITHUB_JOB=%s\n' "$GITHUB_JOB"
          } > "$RUNNER_TEMP/native-gguf-diagnostics/provenance.txt"
          sha256sum android/app/src/main/cpp/llama_jni.cpp android/app/src/main/cpp/CMakeLists.txt >> "$RUNNER_TEMP/native-gguf-diagnostics/provenance.txt"
      - name: Delete temporary test model
        if: always() && matrix.abi == 'x86_64'
        run: rm -f "$RUNNER_TEMP/serea-r7-smollm2-135m-q4_k_m.gguf"
      - name: Upload isolated APK and provenance
        if: always() && hashFiles('android/app/build/outputs/apk/isolated/app-isolated.apk') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g10-b1-isolated-native-${{ matrix.abi }}
          path: |
            android/app/build/outputs/apk/isolated/app-isolated.apk
            ${{ runner.temp }}/apk.sha256
            ${{ runner.temp }}/apk-files.txt
            ${{ runner.temp }}/native-library-report.txt
            ${{ runner.temp }}/native-needed-libraries.txt
            ${{ runner.temp }}/native-library.sha256
            ${{ runner.temp }}/native-source-provenance.txt
          if-no-files-found: error
      - name: Upload JNI test diagnostics
        if: always() && matrix.abi == 'x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g10-b1-jni-gguf-diagnostics
          path: |
            ${{ runner.temp }}/native-jni-diagnostics/**
            ${{ runner.temp }}/native-gguf-diagnostics/**
          if-no-files-found: error
