name: Full CI

on:
  pull_request:
  push:
    branches: [main, 'p3/**']
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit SHA for the identity check
        required: true
        type: string
      head_sha:
        description: Exact checked-out head commit SHA for the identity check
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: full-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-p7-gate-c:
    name: Windows P7 Gate C synthetic validation
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact MSRV
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Verify compiler
        shell: pwsh
        run: |
          rustup run 1.85.0 rustc --version
          rustup run 1.85.0 cargo --version

      - name: Fetch locked dependencies
        run: cargo +1.85.0 fetch --locked

      - name: Feature gated Gate C tests
        run: cargo +1.85.0 test -p serea-storage --lib --features p7-experimental,p7-gate-c p7_ --locked --offline

      - name: Cross-process file lock and termination test
        run: cargo +1.85.0 test -p serea-storage --test p7_gate_c_lock --features p7-gate-c --locked --offline

      - name: Verify default optimized feature isolation
        run: cargo +1.85.0 check -p serea-storage --release --locked --offline

      - name: Verify optimized feature exclusion
        shell: pwsh
        run: |
          cargo +1.85.0 check -p serea-storage --release --features p7-gate-c --locked --offline
          if ($LASTEXITCODE -eq 0) { throw "optimized p7-gate-c unexpectedly compiled" }
          Write-Host "optimized p7-gate-c was correctly rejected"
          exit 0

  linux-stable:
    env:
      SEREA_EVENT_NAME: ${{ github.event_name }}
      SEREA_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SEREA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SEREA_PUSH_BEFORE_SHA: ${{ github.event.before }}
      SEREA_PUSH_AFTER_SHA: ${{ github.sha }}
      SEREA_DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
      SEREA_DISPATCH_HEAD_SHA: ${{ inputs.head_sha }}
      SEREA_DISPATCH_REF_SHA: ${{ github.sha }}
    name: Linux stable full validation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Print environment and toolchain
        run: |
          uname -a
          uname -m
          rustup run stable rustc -vV
          rustup run stable cargo --version
          test "$(uname -m)" = x86_64

      - name: Fetch locked dependencies
        run: cargo +stable fetch --locked

      - name: Workspace smoke guard
        run: python3 tests/workspace_smoke.py

      - name: External Core API boundary regression
        run: python3 tools/check_core_api_boundary.py

      - name: Workspace smoke regression tests (Group O)
        run: python3 -m unittest discover -s tests -p workspace_smoke_tests.py

      - name: Commit identity guard
        run: python3 tools/check_commit_identity.py

      - name: Commit identity guard tests
        run: python3 -m unittest discover -s tests -p commit_identity_tests.py

      - name: Git preflight regression tests
        run: python3 -m unittest discover -s tests -p git_preflight_tests.py

      - name: Git hook Python launcher tests
        run: python3 -m unittest discover -s tests -p git_hook_python_tests.py

      - name: Validate documentation
        run: python3 tools/validate_docs.py docs

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Check Cargo metadata
        run: cargo +stable metadata --no-deps --format-version 1 --offline

      - name: Check workspace (all targets and features)
        run: cargo +stable check --workspace --all-targets --all-features --offline

      - name: Test all targets
        run: cargo +stable test --workspace --all-targets --offline

      - name: Test all features
        run: cargo +stable test --workspace --all-features --offline

      - name: Clippy (deny warnings)
        run: cargo +stable clippy --workspace --all-targets --all-features --offline -- -D warnings

      - name: Prove release fault-seam exclusion
        run: bash tools/prove_release_fault_exclusion.sh target/release-fault-exclusion

  linux-msrv:
    name: Linux MSRV 1.85.0
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact MSRV
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy

      - name: Verify exact compiler and Cargo versions
        run: |
          rustc_version="$(rustup run 1.85.0 rustc --version)"
          printf '%s\n' "$rustc_version"
          case "$rustc_version" in
            "rustc 1.85.0 "*) ;;
            *) echo "Expected rustc 1.85.0 exactly" >&2; exit 1 ;;
          esac
          rustup run 1.85.0 cargo --version

      - name: Fetch locked dependencies
        run: cargo +1.85.0 fetch --locked

      - name: Check workspace (all targets and features)
        run: cargo +1.85.0 check --workspace --all-targets --all-features --locked --offline

      - name: Test all targets
        run: cargo +1.85.0 test --workspace --all-targets --locked --offline

      - name: Test all features
        run: cargo +1.85.0 test --workspace --all-features --locked --offline

      - name: Clippy (deny warnings)
        run: cargo +1.85.0 clippy --workspace --all-targets --all-features --locked --offline -- -D warnings

  macos-intel:
    name: macOS Intel x86_64
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Print environment and require Intel architecture
        run: |
          sw_vers
          uname -m
          rustup run stable rustc -vV
          rustup run stable cargo --version
          test "$(uname -m)" = x86_64

      - name: Fetch locked dependencies
        run: cargo +stable fetch --locked

      - name: Check workspace
        run: cargo +stable check --workspace --all-targets --all-features --offline

      - name: Test all features
        run: cargo +stable test --workspace --all-features --offline

      - name: P2H crash/fault suite
        run: cargo +stable test -p serea-task-engine --test crash --offline

  macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Print environment and require Apple Silicon architecture
        run: |
          sw_vers
          uname -m
          rustup run stable rustc -vV
          rustup run stable cargo --version
          test "$(uname -m)" = arm64

      - name: Fetch locked dependencies
        run: cargo +stable fetch --locked

      - name: Check workspace
        run: cargo +stable check --workspace --all-targets --all-features --offline

      - name: Test all features
        run: cargo +stable test --workspace --all-features --offline

      - name: P2H crash/fault suite
        run: cargo +stable test -p serea-task-engine --test crash --offline
