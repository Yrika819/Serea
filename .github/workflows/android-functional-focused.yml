name: Android Functional Focused (Non-Required)

on:
  workflow_dispatch:
  push:
    branches: [codex/serea-personal-beta-functional-integration]
    paths:
      - '.github/workflows/android-functional-focused.yml'
      - 'android/**'
      - 'tools/run_android_functional_focused.sh'
      - 'tools/verify_android_instrumentation.py'

permissions:
  contents: read

concurrency:
  group: android-functional-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-unit:
    name: Provider sessions, Chat Egress and source binding (focused unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run provider session, Chat Egress and UI source-boundary tests
        working-directory: android
        run: >-
          ./gradlew --no-daemon :app:testDebugUnitTest
          --tests '*CalendarProviderSessionsTest'
          --tests '*AppProviderCompositionTest'
          --tests '*GoogleCalendarHttpReadPortTest'
          --tests '*GmailProviderSessionsTest'
          --tests '*GmailHttpReadPortTest'
          --tests '*GoogleAuthorizationTest'
          --tests '*CalendarAgendaUiControllerTest'
          --tests '*CalendarAgendaUiSecurityTest'
          --tests '*GmailViewModelTest'
          --tests '*AdaptiveModelRouterTest'
          --tests '*SecurityPortsTest'
          --tests '*ChatViewModelTest'
          --tests '*UsageLedgerCostTest'
          --tests '*GoogleOriginEgressAdversarialTest'
          --tests '*LocalFakeRoutingAdversarialTest'
      - name: Verify focused unit JUnit results
        run: python3 tools/verify_android_unit_junit.py android/app/build/test-results/testDebugUnitTest
      - name: Upload focused unit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serea-functional-provider-unit
          if-no-files-found: warn
          retention-days: 14
          path: android/app/build/test-results/testDebugUnitTest/

  api26-focused:
    name: API 26 focused Fake providers, local Chat and Tasks E2E
    needs: provider-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools emulator
      - name: Verify runner KVM and prepare accelerated disposable emulator
        run: |
          set -euo pipefail
          host_file="$RUNNER_TEMP/serea-functional-api26-host.txt"
          artifact_file='android/app/build/outputs/androidTest-results/functional-api26-host/host-diagnostics.txt'
          preserve_host_diagnostics() {
            mkdir -p "$(dirname "$artifact_file")"
            if [ -s "$host_file" ]; then cp "$host_file" "$artifact_file"; fi
          }
          trap preserve_host_diagnostics EXIT
          {
            echo 'runner_os:'
            cat /etc/os-release
            echo 'runner_arch:'
            uname -m
            echo 'runner_cpu:'
            lscpu
            echo 'runner_cpu_quota:'
            for quota in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpu/cpu.cfs_quota_us /sys/fs/cgroup/cpu/cpu.cfs_period_us; do
              if [ -r "$quota" ]; then echo "$quota=$(cat "$quota")"; fi
            done
            echo 'runner_memory:'
            free -h
            echo 'runner_cpu_pressure_before_emulator:'
            cat /proc/pressure/cpu
            echo 'kvm_before_permissions:'
            if [ -e /dev/kvm ]; then
              stat -Lc 'device=%n owner=%U group=%G mode=%a' /dev/kvm
              id
              if "$ANDROID_HOME/emulator/emulator" -accel-check; then :; else echo 'pre_permission_accel_check=unavailable'; fi
            else
              echo '/dev/kvm: absent'
              exit 1
            fi
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            stat -Lc 'device=%n owner=%U group=%G mode=%a' /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
            "$ANDROID_HOME/emulator/emulator" -version
            "$ANDROID_HOME/emulator/emulator" -accel-check
            echo 'runner_cpu_pressure_after_kvm_setup:'
            cat /proc/pressure/cpu
          } | tee "$host_file"
      - name: Boot API 26 disposable Emulator and run focused app-shell tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          SEREA_DISPOSABLE_CI_EMULATOR: '1'
          SEREA_SYSTEM_IMAGE_TARGET: google_apis
          SEREA_EMULATOR_PROFILE: pixel
          SEREA_EMULATOR_ARCH: x86
          SEREA_EMULATOR_GPU_BACKEND: swiftshader_indirect
        with:
          api-level: 26
          target: google_apis
          arch: x86
          profile: pixel
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          script: bash ../tools/run_android_functional_focused.sh 26
      - name: Upload API 26 focused evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serea-functional-api26-focused
          if-no-files-found: warn
          retention-days: 14
          path: |
            android/app/build/outputs/androidTest-results/functional-api26/
            android/app/build/outputs/androidTest-results/functional-api26-host/

