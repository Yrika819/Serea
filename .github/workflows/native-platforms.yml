name: Native platform validation

on:
  pull_request:
  push:
    branches: [main, 'platform/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    name: Stable ${{ matrix.platform }} (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            os: windows
            arch: AMD64
          - platform: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            os: windows
            arch: ARM64
          - platform: macOS x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            os: darwin
            arch: x86_64
          - platform: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
            os: darwin
            arch: arm64
          - platform: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            os: linux
            arch: x86_64
          - platform: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
            arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Verify native operating system and compiler host
        shell: bash
        run: |
          python3 -c 'import platform,sys; expected_os="${{ matrix.os }}"; expected_arch="${{ matrix.arch }}"; actual_os=platform.system().lower(); actual_arch=platform.machine(); print("OS:", actual_os, "architecture:", actual_arch); assert actual_os == expected_os, (actual_os, expected_os); assert actual_arch.lower() == expected_arch.lower(), (actual_arch, expected_arch)'
          rustup run stable rustc -vV
          host="$(rustup run stable rustc -vV | sed -n 's/^host: //p')"
          test "$host" = "${{ matrix.target }}"
          rustup run stable cargo --version

      - name: Fetch locked dependencies
        run: cargo +stable fetch --locked

      - name: Check workspace metadata
        run: cargo +stable metadata --locked --no-deps --format-version 1

      - name: Check and test workspace defaults
        run: |
          cargo +stable check --workspace --all-targets --locked
          cargo +stable test --workspace --all-targets --locked

      - name: Test all workspace features
        run: cargo +stable test --workspace --all-features --locked

      - name: Release build
        run: cargo +stable build --workspace --release --locked

      - name: Synthetic Core startup, task lifecycle, shutdown and recovery
        run: cargo +stable run --locked -p serea-host --features synthetic -- smoke --synthetic

      - name: Synthetic Host child-process lifecycle and crash relaunch
        run: cargo +stable test --locked -p serea-host --features synthetic-test-hooks --test host_lifecycle -- --test-threads=1

      - name: Verify generated native executable architecture
        shell: bash
        run: python3 tools/check_native_binary.py target/release/serea-host${{ matrix.os == 'windows' && '.exe' || '' }} ${{ matrix.target }}

  msrv:
    name: Rust 1.85.0 ${{ matrix.platform }} (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            os: windows
            arch: AMD64
          - platform: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            os: windows
            arch: ARM64
          - platform: macOS x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            os: darwin
            arch: x86_64
          - platform: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
            os: darwin
            arch: arm64
          - platform: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            os: linux
            arch: x86_64
          - platform: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
            arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact MSRV
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Verify native compiler host and exact MSRV
        shell: bash
        run: |
          python3 -c 'import platform; expected_os="${{ matrix.os }}"; expected_arch="${{ matrix.arch }}"; actual_os=platform.system().lower(); actual_arch=platform.machine(); print("OS:", actual_os, "architecture:", actual_arch); assert actual_os == expected_os, (actual_os, expected_os); assert actual_arch.lower() == expected_arch.lower(), (actual_arch, expected_arch)'
          rustc_version="$(rustup run 1.85.0 rustc --version)"
          printf '%s\n' "$rustc_version"
          case "$rustc_version" in "rustc 1.85.0 "*) ;; *) exit 1 ;; esac
          rustup run 1.85.0 rustc -vV
          host="$(rustup run 1.85.0 rustc -vV | sed -n 's/^host: //p')"
          test "$host" = "${{ matrix.target }}"
          rustup run 1.85.0 cargo --version

      - name: Fetch locked dependencies
        run: cargo +1.85.0 fetch --locked

      - name: Check and test workspace
        run: |
          cargo +1.85.0 check --workspace --all-targets --all-features --locked
          cargo +1.85.0 test --workspace --all-targets --locked
          cargo +1.85.0 test --workspace --all-features --locked

      - name: Release build
        run: cargo +1.85.0 build --workspace --release --locked

      - name: Synthetic host smoke
        run: cargo +1.85.0 run -p serea-host --features synthetic --locked -- smoke --synthetic

      - name: Synthetic Host child-process lifecycle and crash relaunch
        run: cargo +1.85.0 test -p serea-host --features synthetic-test-hooks --locked --test host_lifecycle -- --test-threads=1

      - name: Verify generated native executable architecture
        shell: bash
        run: python3 tools/check_native_binary.py target/release/serea-host${{ matrix.os == 'windows' && '.exe' || '' }} ${{ matrix.target }}
