[package]
name = "serea-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# P2H crash/fault seam. Deliberately empty and deliberately NOT a default
# feature: it only compiles when a test target requests it through a
# dev-dependency edge, so `cargo build` and `cargo build --release` contain no
# window type, no arming entry point and no process code at all. See
# `docs/plans/P2H-review-and-closure.md` for the release-exclusion proof.
p2h-fault-injection = []

[dependencies]
serea-protocol.workspace = true
rusqlite.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
