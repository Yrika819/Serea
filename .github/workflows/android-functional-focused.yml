name: Android Functional Focused (Non-Required)

on:
  workflow_dispatch:
  push:
    branches: [codex/serea-personal-beta-functional-integration]
    paths:
      - '.github/workflows/android-functional-focused.yml'
      - 'android/**'
      - 'tools/run_android_functional_focused.sh'
      - 'tools/verify_android_instrumentation.py'

permissions:
  contents: read

concurrency:
  group: android-functional-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-unit:
    name: Provider sessions, Chat Egress and source binding (focused unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run provider session, Chat Egress and UI source-boundary tests
        working-directory: android
        run: >-
          ./gradlew --no-daemon :app:testDebugUnitTest
          --tests '*CalendarProviderSessionsTest'
          --tests '*GoogleCalendarHttpReadPortTest'
          --tests '*GmailProviderSessionsTest'
          --tests '*GmailHttpReadPortTest'
          --tests '*GoogleAuthorizationTest'
          --tests '*CalendarAgendaUiControllerTest'
          --tests '*CalendarAgendaUiSecurityTest'
          --tests '*GmailViewModelTest'
          --tests '*AdaptiveModelRouterTest'
          --tests '*SecurityPortsTest'
          --tests '*ChatViewModelTest'
          --tests '*UsageLedgerCostTest'
          --tests '*GoogleOriginEgressAdversarialTest'
          --tests '*LocalFakeRoutingAdversarialTest'
      - name: Verify focused unit JUnit results
        run: python3 tools/verify_android_unit_junit.py android/app/build/test-results/testDebugUnitTest
      - name: Upload focused unit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serea-functional-provider-unit
          if-no-files-found: warn
          retention-days: 14
          path: android/app/build/test-results/testDebugUnitTest/

  api26-focused:
    name: API 26 focused Fake providers, local Chat and Tasks E2E
    needs: provider-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Boot API 26 disposable Emulator and run focused app-shell tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          SEREA_DISPOSABLE_CI_EMULATOR: '1'
        with:
          api-level: 26
          target: default
          arch: x86
          profile: pixel_2
          disable-animations: true
          working-directory: android
          script: bash ../tools/run_android_functional_focused.sh 26
      - name: Upload API 26 focused evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serea-functional-api26-focused
          if-no-files-found: warn
          retention-days: 14
          path: android/app/build/outputs/androidTest-results/functional-api26/

  api35-focused:
    name: API 35 focused Fake providers, local Chat and Tasks E2E
    needs: api26-focused
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Boot API 35 disposable Emulator and run focused app-shell tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          SEREA_DISPOSABLE_CI_EMULATOR: '1'
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: android
          script: bash ../tools/run_android_functional_focused.sh 35
      - name: Upload API 35 focused evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serea-functional-api35-focused
          if-no-files-found: warn
          retention-days: 14
          path: android/app/build/outputs/androidTest-results/functional-api35/
